<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payrails Card Tokenization Demo</title>
    <link rel="stylesheet" href="/static/dist/main.css" />
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 40px;
        color: #111827;
      }
      .container {
        max-width: 720px;
      }
      .card {
        border: 1px solid #e5e7eb;
        padding: 20px;
        border-radius: 12px;
        margin-top: 16px;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #111827;
        background: #111827;
        color: #fff;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }
      pre {
        background: #f9fafb;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
    <script>
      window.__PAYRAILS_ENV__ = "{{ payrails_environment }}";
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Payrails Card Tokenization Demo</h1>
      <p>Securely tokenize a card and send the token to the backend to trigger a workflow execution.</p>

      <div class="card">
        <div id="card-form-container"></div>
        <button id="submit-button" type="button">Tokenize &amp; Execute</button>
      </div>

      <h3>Status</h3>
      <pre id="status">Waiting for input…</pre>
    </div>

    <script type="module" src="/static/dist/main.js"></script>
  </body>
</html>
